spring:
  application:
    name: dms
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dms}
    username: ${DB_USERNAME:dms}
    password: ${DB_PASSWORD:dms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway quản lý schema; Hibernate kiểm tra entity khớp migration
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

dms:
  keycloak-bootstrap:
    enabled: ${DMS_KEYCLOAK_BOOTSTRAP_ENABLED:false}
    username: ${DMS_KEYCLOAK_INITIAL_ADMIN_USERNAME:admin}
    password: ${DMS_KEYCLOAK_INITIAL_ADMIN_PASSWORD:}
    credential-file: ${DMS_KEYCLOAK_CREDENTIAL_FILE:./data/local-run/keycloak-accounts.local}
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:dms}
    audience: dms-api
    admin-client-id: dms-admin
    admin-client-secret: ${DMS_KEYCLOAK_ADMIN_CLIENT_SECRET:}
  upload-dir: ${DMS_UPLOAD_DIR:./data/uploads}
