name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DMS/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers dùng Docker có sẵn trên runner
      - run: bash ./mvnw -B verify   # bash: bit thực thi của mvnw mất khi commit từ Windows

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DMS/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DMS/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
